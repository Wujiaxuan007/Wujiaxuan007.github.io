<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="卖话的人 · 2015—2020 文字档案" />
  <title>卖话的人 · 2015—2020</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./reading.css" />
  <link rel="stylesheet" href="./stats.css?v=20260915-2" />
</head>
<body>
  <header class="masthead">
    <a class="back" href="/" aria-label="返回主页">←</a>
    <div class="brand">卖话的人</div>
    <button class="index-toggle" id="indexToggle" type="button" aria-expanded="false">目录</button>
  </header>

  <main>
    <section class="hero" id="top">
      <p class="eyebrow">2015—2020</p>
      <h1>卖话的人</h1>
    </section>

    <section class="archive-layout" aria-label="作品档案">
      <div class="catalog-pane">
        <section class="timeline" id="timeline" aria-label="作品时间线"></section>
        <section class="afterword" aria-label="时间线结尾">
          <p class="then">然后，没有了。</p>
          <div class="silence" aria-hidden="true"></div>
          <p class="reopen"><span>2026</span>重新打开。</p>
        </section>
      </div>

      <section class="reader" id="reader" aria-live="polite"></section>
    </section>

    <footer class="footer">
      <p>1995 —</p>
      <p><a href="/">Jacin Woo</a></p>
    </footer>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <strong>作品目录</strong>
      <button id="drawerClose" type="button" aria-label="关闭目录">×</button>
    </div>
    <nav id="drawerList"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <script src="./app.js"></script>
  <script src="./source-audit.js"></script>
  <script src="./stats.js?v=20260915-2"></script>
  <script>
    const desktopReading = window.matchMedia('(min-width: 901px)');
    let catalogPageScroll = 0;

    function markActiveWork(id) {
      document.querySelectorAll('[data-id].is-active').forEach(el => el.classList.remove('is-active'));
      if (!id) return;
      document.querySelectorAll(`[data-id="${CSS.escape(id)}"]`).forEach(el => el.classList.add('is-active'));
    }

    function enterReading(id, push = true) {
      if (!id) return;
      const firstDesktopOpen = desktopReading.matches && !document.body.classList.contains('reading');
      if (firstDesktopOpen) catalogPageScroll = window.scrollY;

      document.body.classList.add('reading');
      const originalScrollIntoView = reader.scrollIntoView;
      reader.scrollIntoView = function () {};
      showWork(id, push);
      reader.scrollIntoView = originalScrollIntoView;
      markActiveWork(id);

      if (desktopReading.matches) {
        requestAnimationFrame(() => {
          window.scrollTo(0, 0);
          reader.scrollTop = 0;
          const active = document.querySelector('.catalog-pane [data-id].is-active');
          if (firstDesktopOpen && active) {
            active.scrollIntoView({block:'center', inline:'nearest'});
          }
        });
      } else {
        document.querySelector('#reader').scrollIntoView({behavior:'smooth', block:'start'});
      }
    }

    function leaveReading(push = true) {
      const wasDesktop = desktopReading.matches;
      document.body.classList.remove('reading');
      markActiveWork(null);
      if (push) history.pushState({}, '', location.pathname);

      if (wasDesktop) {
        requestAnimationFrame(() => window.scrollTo({top: catalogPageScroll, behavior:'auto'}));
      } else {
        document.querySelector('#top').scrollIntoView({behavior:'smooth', block:'start'});
      }
    }

    document.addEventListener('click', function (event) {
      const link = event.target.closest('[data-id]');
      if (link) {
        event.preventDefault();
        event.stopImmediatePropagation();
        enterReading(link.dataset.id, true);
        return;
      }

      const action = event.target.closest('[data-action="back"]');
      if (action) {
        event.preventDefault();
        event.stopImmediatePropagation();
        leaveReading(true);
      }
    }, true);

    window.addEventListener('popstate', function () {
      const id = location.hash.slice(1);
      if (id) enterReading(id, false);
      else leaveReading(false);
    });

    const initialId = location.hash.slice(1);
    if (initialId) enterReading(initialId, false);
  </script>
</body>
</html>
