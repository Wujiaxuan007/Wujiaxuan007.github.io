<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="卖话的人 · 2015—2020 文字档案" />
  <title>卖话的人 · 2015—2020</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="masthead">
    <a class="back" href="/" aria-label="返回主页">←</a>
    <div class="brand">卖话的人</div>
    <button class="index-toggle" id="indexToggle" type="button" aria-expanded="false">目录</button>
  </header>

  <main>
    <section class="hero" id="top">
      <p class="eyebrow">2015—2020</p>
      <h1>卖话的人</h1>
    </section>

    <section class="archive-layout" aria-label="作品档案">
      <div class="catalog-pane">
        <section class="timeline" id="timeline" aria-label="作品时间线"></section>
        <section class="afterword" aria-label="时间线结尾">
          <p class="then">然后，没有了。</p>
          <div class="silence" aria-hidden="true"></div>
          <p class="reopen"><span>2026</span>重新打开。</p>
        </section>
      </div>

      <section class="reader" id="reader" aria-live="polite">
        <div class="reader-empty">
          <span class="reader-mark">↗</span>
          <p>从左边选一首。</p>
        </div>
      </section>
    </section>

    <footer class="footer">
      <p>1995 —</p>
      <p><a href="/">Jacin Woo</a></p>
    </footer>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <strong>作品目录</strong>
      <button id="drawerClose" type="button" aria-label="关闭目录">×</button>
    </div>
    <nav id="drawerList"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <script src="./app.js"></script>
  <script>
    // 桌面端保持左侧目录位置，只替换右侧阅读区；移动端仍使用原来的单栏阅读行为。
    document.addEventListener('click', function (event) {
      if (!window.matchMedia('(min-width: 901px)').matches) return;
      const link = event.target.closest('[data-id]');
      if (!link) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      const originalScroll = reader.scrollIntoView;
      reader.scrollIntoView = function () {};
      showWork(link.dataset.id);
      reader.scrollIntoView = originalScroll;
      document.querySelectorAll('[data-id].is-active').forEach(el => el.classList.remove('is-active'));
      document.querySelectorAll(`[data-id="${link.dataset.id}"]`).forEach(el => el.classList.add('is-active'));
    }, true);
  </script>
</body>
</html>
